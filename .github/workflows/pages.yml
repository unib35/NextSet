name: Publish support pages
on:
  push:
    branches: [main]
    paths:
      - 'NextSet/NextSet/*.lproj/PrivacyPolicy.txt'
      - 'docs/release/SUPPORT*.md'
      - 'tools/release-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build public pages
        run: python3 tools/release-site/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/release/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public pages
        id: deployment
        uses: actions/deploy-pages@v4
